[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codpm"
version = "0.1.0"
description = "Codex Personalization Manager"
requires-python = ">=3.11"

[project.scripts]
codpm = "codpm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["codpm*"]
